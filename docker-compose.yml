version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: fintech-postgres
    restart: always
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: fintech-api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fintech
      NODE_ENV: development
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_P8: ${APPLE_PRIVATE_KEY_P8:-}
      APPLE_REFRESH_TOKEN_ENCRYPTION_KEY: ${APPLE_REFRESH_TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    command: npm run start:prod

volumes:
  postgres_data:
