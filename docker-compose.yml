version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: fintech-postgres
    restart: always
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: fintech-api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fintech
      NODE_ENV: development
    ports:
      - "3000:3000"
    command: npm run start:prod

volumes:
  postgres_data: