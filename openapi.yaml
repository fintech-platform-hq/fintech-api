        '200':
          description: Current result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeProof'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/password/change:
    post:
      summary: Consume the proof and atomically change the password
      operationId: commitPasswordChange
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeCommit'
      responses:
        '204':
          description: Applied with an empty response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/password/change/{operationId}:
    get:
      summary: Read the operation outcome without performing the change
      operationId: readPasswordChangeOutcome
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: operationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /accounts:
    get:
      summary: List accounts owned by the authenticated user
      operationId: listAccounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts owned by the authenticated user. An empty list is valid.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create an account for the authenticated user
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /transactions:
    post:
      summary: Create or replay a transaction
      operationId: createTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID that remains stable for every retry of the same complete request payload.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '201':
          description: Transaction created, or the original transaction returned for an identical replay.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      summary: Check process liveness
      description: Confirms only that the application process is responding; it does not check database readiness.
      operationId: getHealth
      responses:
        '200':
          description: Application process is responding.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ready:
    get:
      summary: Check database and schema readiness
      description: Returns ready only when PostgreSQL is reachable and the deployed schema compatibility version matches this API. It does not expose dependency details.
      operationId: getReadiness
      responses:
        '200':
          description: Database is reachable and the schema is compatible.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        '503':
          description: Database is unavailable or the schema is incompatible; no database details are returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: not_ready
components:
  parameters:
    IdentityMethodOperationId:
      in: header
      name: Idempotency-Key
      required: false
      description: >
        Use one UUID per deliberate method change. An already committed UUID replays its
        original result within the same holder and session family, without rechecking
        single-use proofs or applying the supplied payload again. Reuse for another action
        returns 409. For uncertain outcomes, query the receipt with GET. Clients without
        this header keep the existing behavior. For an Apple unlink with a UUID, use a
        password session so it remains authorized to consult the receipt.
      schema: { type: string, format: uuid }
  requestBodies:
    MvpOpening:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MvpOpening'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Server-generated request correlation UUID.
      schema:
        type: string
        format: uuid
  schemas:
    MvpOpening:
      type: object
      additionalProperties: false
      required: [baseMinor, coverageStart, referenceZone]
      properties:
        baseMinor:
          type: string
          pattern: '^(0|-?[1-9][0-9]{0,18})$'
          description: Signed Int64 in minor units.
          examples: ['0', '-5500']
        coverageStart:
          type: string
          format: date-time
          description: UTC timestamp ending in Z, up to six fractional digits, at or before server time.
        referenceZone:
          type: string
          maxLength: 64
          description: IANA reference zone used for displaying the chosen instant.
          examples: [America/Sao_Paulo]
        accountId:
          type: string
          format: uuid
          description: Explicit legacy adoption target. Adoption remains blocked.
    MvpAccountSummary:
      type: object
      required:
        [
          principalId,
          account,
          legacyAccounts,
          status,
          base,
          balanceMinor,
          revision,
          asOf,
        ]
      properties:
        principalId: { type: string, format: uuid }
        account:
          oneOf:
            - $ref: '#/components/schemas/AccountResponse'
            - type: 'null'
        legacyAccounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        status:
          type: string
          enum: [no_account, base_required, unavailable, available]
        base:
          type: [object, 'null']
          required: [baseMinor, coverageStart, referenceZone, confirmedAt]
          properties:
            baseMinor: { type: string }
            coverageStart: { type: string, format: date-time }
            referenceZone: { type: string }
            confirmedAt: { type: string, format: date-time }
        balanceMinor:
          type: [string, 'null']
          description: Exact signed minor units. Null when unavailable.
        baseSuspended:
          type: [boolean, 'null']
          description: True while the owner has suspended figures for review.
        revision:
          type: [string, 'null']
          description: Monotonic decimal revision, present for the active MVP account.
        asOf: { type: string, format: date-time }
    MvpTransactionRequest:
      type: object
      additionalProperties: false
      required: [accountId, type, amountMinor, currency, occurredAt, clientMutationId, expectedRevision]
      properties:
        accountId: { type: string, format: uuid }
        type: { type: string, enum: [income, expense] }
        amountMinor: { type: integer, minimum: 1, maximum: 999999999 }
        currency: { type: string, const: BRL }
        description: { type: [string, 'null'], maxLength: 255 }
        occurredAt:
          type: string
          format: date-time
          description: Precise timestamp with offset and up to six fractional digits.
        clientMutationId: { type: string, format: uuid }
        expectedRevision: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
    MvpMovement:
      type: object
      required: [id, accountId, type, amountMinor, currency, description, occurredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        type: { type: string, enum: [income, expense] }
        amountMinor: { type: string, pattern: '^[1-9][0-9]*$' }
        currency: { type: string, const: BRL }
        description: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    MvpHistoryPage:
      type: object
      required: [summary, entries, nextCursor]
      properties:
        summary:
          $ref: '#/components/schemas/MvpAccountSummary'
        entries:
          type: array
          maxItems: 50
          items:
            allOf:
              - $ref: '#/components/schemas/MvpMovement'
              - type: object
                required: [coverage]
                properties:
                  coverage: { type: string, enum: [covered, before_base, after_cut, no_base] }
                  occurrenceDay:
                    type: [string, 'null']
                    format: date
                    description: Display this civil day without a time when present. In this case occurredAt is the lower interval bound retained as the history ordering key.
                  occurrenceZone:
                    type: [string, 'null']
                    description: IANA account zone frozen with a civil day.
                  auditAction:
                    type: [string, 'null']
                    enum: [correct, invalidate, null]
                    description: Latest audit action. Invalidation keeps the entry visible and removes its monetary contribution.
        nextCursor: { type: [string, 'null'] }
    MvpCheckFields:
      type: object
      required: [accountId, observedMinor, referenceAt]
      properties:
        accountId: { type: string, format: uuid }
        observedMinor:
          type: string
          pattern: '^(0|-?[1-9][0-9]{0,18})$'
          description: Canonical signed Int64 in minor units. Explicit zero is allowed.
        referenceAt:
          type: string
          format: date-time
          description: UTC timestamp ending in Z with up to six fractional digits. The account coverage start and server time are inclusive.
    MvpCheckInput:
      allOf:
        - $ref: '#/components/schemas/MvpCheckFields'
      unevaluatedProperties: false
    MvpCheckPreview:
      allOf:
        - $ref: '#/components/schemas/MvpCheckFields'
        - type: object
          required: [revision, calculatedMinor, differenceMinor]
          properties:
            revision: { type: string }
            calculatedMinor: { type: string, pattern: '^(0|-?[1-9][0-9]*)$' }
            differenceMinor:
              type: string
              pattern: '^(0|-?[1-9][0-9]*)$'
              description: Calculated balance at the reference time minus observed balance.
    MvpCheckConfirmation:
      allOf:
        - $ref: '#/components/schemas/MvpCheckFields'
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision:
              type: string
              pattern: '^[1-9][0-9]{0,18}$'
              description: Account revision returned by the preview.
      unevaluatedProperties: false
    MvpCheckReceipt:
      allOf:
        - $ref: '#/components/schemas/MvpCheckFields'
        - type: object
          required: [id, authorId, revision, createdAt, baseConfirmedAt, originalCalculatedMinor, originalDifferenceMinor]
          properties:
            id: { type: string, format: uuid }
            authorId: { type: string, format: uuid }
            revision:
              type: string
              description: Account revision after confirmation. Confirmation does not change the balance.
            createdAt: { type: string, format: date-time }
            baseConfirmedAt: { type: string, format: date-time }
            originalCalculatedMinor: { type: string, pattern: '^(0|-?[1-9][0-9]*)$' }
            originalDifferenceMinor: { type: string, pattern: '^(0|-?[1-9][0-9]*)$' }
    MvpChecksPage:
      type: object
      required: [summary, entries, nextAfter]
      properties:
        summary:
          $ref: '#/components/schemas/MvpAccountSummary'
        entries:
          type: array
          maxItems: 50
          items:
            allOf:
              - $ref: '#/components/schemas/MvpCheckReceipt'
              - type: object
                required:
                  [calculatedAtReferenceMinor, remainingDifferenceMinor, status]
                properties:
                  calculatedAtReferenceMinor:
                    { type: [string, 'null'], pattern: '^(0|-?[1-9][0-9]*)$' }
                  remainingDifferenceMinor:
                    { type: [string, 'null'], pattern: '^(0|-?[1-9][0-9]*)$' }
                  status:
                    type: string
                    enum: [open, coincident, unavailable]
                    description: Backward-compatible state. Nonzero remaining difference is open. Zero is numerically coincident.
                  resolutionStatus:
                    type: string
                    enum:
                      [
                        open,
                        coincident,
                        partially_explained,
                        resolved,
                        unavailable,
                      ]
                    description: The resolved state requires traceable linked expense deltas that fully explain the original difference.
                  supersededBy: { type: [string, 'null'], format: uuid }
                  replacesCheckId: { type: [string, 'null'], format: uuid }
                  replacementReason: { type: [string, 'null'] }
        nextAfter:
          type: [string, 'null']
          format: uuid
    MvpAuditFields:
      type: object
      required: [accountId, targetId, action, reason]
      description: 'Use the movement ID for correct or invalidate, and the observation ID for replace_check. Correct requires at least one changed field. Invalidate only takes the common fields. Replacement requires observedMinor and referenceAt. Base actions use accountId as targetId. Correction requires an explicit baseMinor and may include coverageStart. Suspension takes only the common fields. Refinement accepts occurredAt within the stored date-only interval and uses the movement ID.'
      properties:
        accountId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        action:
          {
            type: string,
            enum:
              [
                correct,
                invalidate,
                replace_check,
                suspend_base,
                correct_base,
                refine_occurrence,
              ],
          }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        amountMinor: { type: string, pattern: '^[1-9][0-9]{0,8}$' }
        description:
          type: string
          maxLength: 240
          description: Empty clears the description. Omit to keep the current description.
        occurredAt:
          type: string
          format: date-time
          description: Precise UTC instant. Omit to preserve existing occurrence precision.
        observedMinor: { type: string, pattern: '^(0|-?[1-9][0-9]{0,18})$' }
        referenceAt: { type: string, format: date-time }
        baseMinor: { type: string, pattern: '^(0|-?[1-9][0-9]{0,18})$' }
        coverageStart:
          {
            type: string,
            format: date-time,
            description: Precise UTC instant. Omit to keep the existing start.,
          }
    MvpAuditPreview:
      type: object
      required:
        [
          accountId,
          targetId,
          revision,
          balanceMinor,
          projectedBalanceMinor,
          checks,
          previewToken,
        ]
      properties:
        accountId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        revision: { type: string }
        balanceMinor: { type: [string, 'null'] }
        projectedBalanceMinor: { type: [string, 'null'] }
        previewToken: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        previousBaseMinor: { type: string }
        previousCoverageStart: { type: string, format: date-time }
        proposedBaseMinor: { type: string }
        proposedCoverageStart: { type: string, format: date-time }
        ambiguousMovementIds:
          type: array
          items: { type: string, format: uuid }
        coverageChanges:
          type: array
          items:
            type: object
            required:
              [id, description, occurrenceDay, occurredAt, before, after]
            properties:
              id: { type: string, format: uuid }
              description: { type: [string, 'null'] }
              occurrenceDay: { type: [string, 'null'], format: date }
              occurredAt: { type: [string, 'null'], format: date-time }
              before: { enum: [covered, before_base] }
              after: { enum: [covered, before_base, ambiguous] }
        checks:
          type: array
          items:
            type: object
            required:
              [
                id,
                referenceAt,
                originalDifferenceMinor,
                beforeMinor,
                afterMinor,
              ]
            properties:
              id: { type: string, format: uuid }
              referenceAt: { type: string, format: date-time }
              originalDifferenceMinor: { type: string }
              beforeMinor: { type: [string, 'null'] }
              afterMinor: { type: [string, 'null'] }
    MvpAuditReceipt:
      type: object
      required: [id, accountId, authorId, revision, createdAt, action, reason]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        revision: { type: string }
        createdAt: { type: string, format: date-time }
        action:
          {
            type: string,
            enum:
              [
                correct,
                invalidate,
                replace_check,
                suspend_base,
                correct_base,
                refine_occurrence,
              ],
          }
        reason: { type: string }
        baseMinor: { type: string }
        coverageStart: { type: string, format: date-time }
        referenceZone: { type: string }
        transactionId: { type: string, format: uuid }
        replacesCheckId: { type: string, format: uuid }
        observedMinor: { type: string }
        referenceAt: { type: string, format: date-time }
        baseConfirmedAt: { type: string, format: date-time }
        originalCalculatedMinor: { type: string }
        originalDifferenceMinor: { type: string }
    MvpBaseVersion:
      type: object
      required:
        [
          id,
          accountId,
          authorId,
          revision,
          action,
          reason,
          baseMinor,
          coverageStart,
          referenceZone,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        revision: { type: string }
        action: { enum: [original, suspend_base, correct_base] }
        reason: { type: [string, 'null'] }
        baseMinor: { type: string }
        coverageStart: { type: string, format: date-time }
        referenceZone: { type: string }
        createdAt: { type: string, format: date-time }
    MvpMovementVersion:
      type: object
      required:
        [
          id,
          action,
          authorId,
          reason,
          amountMinor,
          description,
          occurrenceDay,
          occurredAt,
          createdAt,
          revision,
        ]
      properties:
        id: { type: string, format: uuid }
        action:
          {
            type: string,
            enum: [original, correct, invalidate, refine_occurrence],
          }
        authorId: { type: string, format: uuid }
        reason: { type: [string, 'null'] }
        amountMinor: { type: string }
        description: { type: [string, 'null'] }
        occurrenceDay: { type: [string, 'null'], format: date }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        revision: { type: [string, 'null'] }
    MvpRecoveryFields:
      type: object
      required: [accountId, checkId, amountMinor, day]
      dependentRequired:
        externalSource: [externalReference]
        externalReference: [externalSource]
      properties:
        accountId: { type: string, format: uuid }
        checkId: { type: string, format: uuid }
        amountMinor: { type: string, pattern: '^[1-9][0-9]{0,8}$' }
        day:
          type: string
          format: date
          description: Expense civil day in the active account's IANA reference zone.
        occurredAt:
          type: [string, 'null']
          format: date-time
          description: Optional precise UTC instant ending in Z, with at most six fractional digits. Omit for day precision.
        description: { type: string, maxLength: 240 }
        externalSource:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
          description: External issuer namespace.
        externalReference:
          type: string
          minLength: 1
          maxLength: 200
          description: A genuine, case-sensitive identifier supplied by the issuer. Unique within the account and issuer. Never derive it from the transaction attributes.
    MvpRecoveryInput:
      allOf:
        - $ref: '#/components/schemas/MvpRecoveryFields'
      unevaluatedProperties: false
    MvpRecoveryConfirmation:
      allOf:
        - $ref: '#/components/schemas/MvpRecoveryFields'
        - type: object
          required: [expectedRevision, action, evidence]
          properties:
            expectedRevision: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
            action: { type: string, enum: [link, create] }
            transactionId: { type: string, format: uuid }
            evidence:
              type: string
              minLength: 1
              maxLength: 1000
              description: User's statement identifying the source of the evidence. Attachments are outside this contract.
          if:
            properties:
              action: { const: link }
          then:
            required: [transactionId]
          else:
            not:
              required: [transactionId]
      unevaluatedProperties: false
    MvpRecoveryPreview:
      type: object
      required: [checkId, accountId, revision, referenceZone, dateStatus, balanceMinor, remainingDifferenceMinor, projectedBalanceMinor, projectedRemainingDifferenceMinor, ambiguousCheckIds, candidates, existingRecovery]
      properties:
        checkId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        revision: { type: string }
        referenceZone: { type: string }
        dateStatus:
          type: string
          enum: [eligible, time_required, outside_coverage, after_check]
          description: Eligibility to create a distinct expense. Manual linking validates the selected existing expense separately.
        balanceMinor: { type: string, pattern: '^(0|-?[1-9][0-9]*)$' }
        remainingDifferenceMinor: { type: string, pattern: '^(0|-?[1-9][0-9]*)$' }
        projectedBalanceMinor: { type: [string, 'null'], pattern: '^(0|-?[1-9][0-9]*)$' }
        projectedRemainingDifferenceMinor: { type: [string, 'null'], pattern: '^(0|-?[1-9][0-9]*)$' }
        ambiguousCheckIds:
          type: array
          items: { type: string, format: uuid }
        candidates:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, amountMinor, description, occurredAt, occurrenceDay, occurrenceZone, alreadyLinked]
            properties:
              id: { type: string, format: uuid }
              amountMinor: { type: string, pattern: '^[1-9][0-9]{0,8}$' }
              description: { type: [string, 'null'] }
              occurredAt: { type: [string, 'null'], format: date-time }
              occurrenceDay: { type: [string, 'null'], format: date }
              occurrenceZone: { type: [string, 'null'] }
              alreadyLinked: { type: boolean }
        existingRecovery:
          anyOf:
            - $ref: '#/components/schemas/MvpRecoveryReceipt'
            - type: 'null'
    MvpRecoveryReceipt:
      type: object
      required: [id, accountId, checkId, authorId, action, transactionId, revision, createdAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        checkId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        action: { type: string, enum: [link, create] }
        transactionId: { type: string, format: uuid }
        revision: { type: string }
        createdAt: { type: string, format: date-time }
    IdentitySession:
      type: object
      required: [email, passwordVerified, hasPassword, hasApple, financialAccess, authMethod]
      properties:
        email: { type: [string, 'null'], format: email }
        passwordVerified: { type: boolean }
        hasPassword: { type: boolean }
        hasApple: { type: boolean }
        financialAccess: { type: boolean }
        authMethod: { type: string, enum: [password, apple] }
    IdentityEmail:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    EmailProof:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    PasswordProof:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    RecoveryProof:
      allOf:
        - $ref: '#/components/schemas/IdentityEmail'
        - $ref: '#/components/schemas/EmailProof'
        - type: object
          required: [newPassword]
          properties:
            newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    AppleLinkProof:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/AppleAuthorizationFields'
        - $ref: '#/components/schemas/PasswordProof'
        - type: object
          required: [consent]
          properties:
            consent: { const: true }
    PasswordLinkRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/AppleAuthorizationFields'
        - $ref: '#/components/schemas/IdentityEmail'
        - type: object
          required: [consent]
          properties:
            consent: { const: true }
    PasswordChangePreparation:
      allOf:
        - $ref: '#/components/schemas/PasswordProof'
        - type: object
          required: [operationId]
          properties:
            operationId: { type: string, format: uuid }
    PasswordChangeProof:
      type: object
      required: [proof]
      properties:
        proof: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    PasswordChangeCommit:
      allOf:
        - $ref: '#/components/schemas/PasswordChangeProof'
        - type: object
          required: [operationId, newPassword]
          properties:
            operationId: { type: string, format: uuid }
            newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    PasswordChangeOutcome:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [committed, unknown] }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Normalized by trimming surrounding whitespace and lowercasing.
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          maxLength: 256
    AppleAuthenticationRequest:
      $ref: '#/components/schemas/AppleAuthorizationFields'
      unevaluatedProperties: false
    AppleAuthorizationFields:
      type: object
      required: [identityToken, authorizationCode, nonce]
      properties:
        identityToken:
          type: string
          minLength: 1
          maxLength: 16384
          description: Compact RS256 identity token returned by Apple.
        authorizationCode:
          type: string
          minLength: 1
          maxLength: 4096
          description: Single-use authorization code returned by Apple.
        nonce:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Exact unpadded Base64URL raw nonce sent to Apple for this authorization attempt.
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, currency]
      properties:
        name:
          type: string
          minLength: 1
          description: User-provided account name; leading and trailing whitespace is removed before persistence, and whitespace-only names are invalid.
        currency:
          type: string
          const: BRL
          description: BRL is the only supported account currency in the current MVP.
    AccountResponse:
      type: object
      additionalProperties: false
      required: [id, name, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          const: BRL
        createdAt:
          type: string
          format: date-time
    TransactionRequest:
      type: object
      additionalProperties: false
      required:
        - accountId
        - type
        - amountMinor
        - currency
        - occurredAt
        - clientMutationId
      properties:
        accountId:
          type: string
          format: uuid
        categoryId:
          type: [string, 'null']
          format: uuid
        type:
          type: string
          enum: [expense, income]
          description: expense is an outgoing amount; income is an incoming amount.
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        description:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
        clientMutationId:
          type: string
          format: uuid
          description: Stable for retries of one logical operation; not independently persisted or database-unique in this milestone.
    TransactionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - accountId
        - categoryId
        - type
        - amountMinor
        - currency
        - description
        - occurredAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        categoryId:
          type: [string, 'null']
          format: uuid
        type:
          type: string
          enum: [expense, income]
          description: expense is an outgoing amount; income is an incoming amount.
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        description:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
    AccountLinkRequiredError:
      type: object
      additionalProperties: false
      required: [statusCode, message, code]
      properties:
        statusCode:
          type: integer
          const: 409
        message:
          type: string
          const: Account linking required
        code:
          type: string
          const: ACCOUNT_LINK_REQUIRED
  responses:
    MvpAccountSummary:
      description: Account, base, revision and balance at one server cut. For opening, this is the canonical receipt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MvpAccountSummary'
    MvpUnavailable:
      description: Temporary financial persistence failure or lock timeout. Retry a confirmation with the original key and payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MvpConflict:
      description: Idempotency, account revision, coverage precision, movement eligibility or external reference conflict.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code, message]
            properties:
              statusCode: { const: 409 }
              code:
                enum:
                  [
                    IDEMPOTENCY_CONFLICT,
                    MVP_ACCOUNT_EXISTS,
                    LEGACY_ADOPTION_BLOCKED,
                    BASE_REQUIRED,
                    STALE_REVISION,
                    OCCURRENCE_TIME_REQUIRED,
                    EXTERNAL_REFERENCE_CONFLICT,
                    MOVEMENT_ALREADY_LINKED,
                    MOVEMENT_INELIGIBLE,
                    AUDIT_PREVIEW_REQUIRED,
                    AUDIT_TARGET_INACTIVE,
                    BASE_SUSPENDED,
                  ]
              message: { type: string }
    AuthTokens:
      description: Access token and a new opaque refresh token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    BadRequest:
      description: Invalid header or request body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Unique resource conflict or idempotency key reused with a different payload.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountLinkRequired:
      description: The verified Apple email belongs to another user; explicit linking is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountLinkRequiredError'
    Unauthorized:
      description: Missing, invalid, or expired authentication credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: A valid credential does not have the required password-origin authentication method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Account or category does not exist for the authenticated user. Foreign-owned resources are intentionally indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Authentication endpoint rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server or persistence failure.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Apple authentication is temporarily unavailable or misconfigured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
