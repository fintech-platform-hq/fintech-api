openapi: 3.1.0
info:
  title: Fintech API
  version: 0.0.1
  description: Public contract for authenticated accounts, personal balances and transaction creation.
servers:
  - url: https://fintech-api-87yw.onrender.com
    description: Production
  - url: http://localhost:3000
    description: Local development
security: []
paths:
  /mvp/account:
    get:
      summary: Read the authenticated personal-account summary
      operationId: getMvpAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MvpAccountSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
    post:
      summary: Confirm opening a new personal BRL account with its opening balance
      description: An explicit accountId requests legacy adoption, which remains blocked. An identical confirmed request replays its original result.
      operationId: openMvpAccount
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        $ref: '#/components/requestBodies/MvpOpening'
      responses:
        '201':
          $ref: '#/components/responses/MvpAccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/account/{accountId}:
    get:
      summary: Read the financial state of an owned BRL account by ID
      operationId: getOwnMvpAccount
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/MvpAccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/account-previews:
    post:
      summary: Review opening terms without persisting any effect
      operationId: previewMvpOpening
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/MvpOpening'
      responses:
        '200':
          description: Validated opening terms to confirm explicitly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpOpening'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/account/{accountId}/history:
    get:
      summary: Read an owned account, balance and a page of confirmed movements
      description: The summary and page use the same snapshot. The cursor preserves the cut and snapshot version. Reload the first page on STALE_REVISION. Movements are ordered by occurredAt descending and then by ID descending.
      operationId: getMvpHistory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 600 }
      responses:
        '200':
          description: First or subsequent page with up to 50 movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/transactions:
    post:
      summary: Register an income or expense in the active personal account
      description: An identical confirmation replays the original receipt before checking the live revision. New movements require BRL, a confirmed base, and an occurrence from the coverage start through server time, inclusive.
      operationId: registerMvpTransaction
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MvpTransactionRequest'
      responses:
        '201':
          description: Canonical receipt persisted with the movement and the new revision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MvpMovement'
                  - type: object
                    required: [revision]
                    properties:
                      revision: { type: string, pattern: '^[1-9][0-9]*$' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /auth/register:
    post:
      summary: Register with email and password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      summary: Authenticate with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/apple:
    post:
      summary: Authenticate with Sign in with Apple
      operationId: authenticateWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthenticationRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/AccountLinkRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/apple/link:
    post:
      summary: Explicitly link a Sign in with Apple identity
      operationId: linkAppleIdentity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthenticationRequest'
      responses:
        '204':
          description: Apple identity linked; the current session remains valid.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      summary: Rotate a refresh token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      summary: Revoke a refresh session
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Session revoked; no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /accounts:
    get:
      summary: List accounts owned by the authenticated user
      operationId: listAccounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts owned by the authenticated user. An empty list is valid.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create an account for the authenticated user
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /transactions:
    post:
      summary: Create or replay a transaction
      operationId: createTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID that remains stable for every retry of the same complete request payload.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '201':
          description: Transaction created, or the original transaction returned for an identical replay.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      summary: Check process liveness
      description: Confirms only that the application process is responding; it does not check database readiness.
      operationId: getHealth
      responses:
        '200':
          description: Application process is responding.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  requestBodies:
    MvpOpening:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MvpOpening'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Server-generated request correlation UUID.
      schema:
        type: string
        format: uuid
  schemas:
    MvpOpening:
      type: object
      additionalProperties: false
      required: [baseMinor, coverageStart, referenceZone]
      properties:
        baseMinor:
          type: string
          pattern: '^(0|-?[1-9][0-9]{0,18})$'
          description: Signed Int64 in minor units.
          examples: ['0', '-5500']
        coverageStart:
          type: string
          format: date-time
          description: UTC timestamp ending in Z, up to six fractional digits, at or before server time.
        referenceZone:
          type: string
          maxLength: 64
          description: IANA reference zone used for displaying the chosen instant.
          examples: [America/Sao_Paulo]
        accountId:
          type: string
          format: uuid
          description: Explicit legacy adoption target. Adoption remains blocked.
    MvpAccountSummary:
      type: object
      required: [principalId, account, legacyAccounts, status, base, balanceMinor, revision, asOf]
      properties:
        principalId: { type: string, format: uuid }
        account:
          oneOf:
            - $ref: '#/components/schemas/AccountResponse'
            - type: 'null'
        legacyAccounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        status:
          type: string
          enum: [no_account, base_required, unavailable, available]
        base:
          type: [object, 'null']
          required: [baseMinor, coverageStart, referenceZone, confirmedAt]
          properties:
            baseMinor: { type: string }
            coverageStart: { type: string, format: date-time }
            referenceZone: { type: string }
            confirmedAt: { type: string, format: date-time }
        balanceMinor:
          type: [string, 'null']
          description: Exact signed minor units. Null when unavailable.
        revision:
          type: [string, 'null']
          description: Monotonic decimal revision, present for the active MVP account.
        asOf: { type: string, format: date-time }
    MvpTransactionRequest:
      type: object
      additionalProperties: false
      required: [accountId, type, amountMinor, currency, occurredAt, clientMutationId, expectedRevision]
      properties:
        accountId: { type: string, format: uuid }
        type: { type: string, enum: [income, expense] }
        amountMinor: { type: integer, minimum: 1, maximum: 999999999 }
        currency: { type: string, const: BRL }
        description: { type: [string, 'null'], maxLength: 255 }
        occurredAt:
          type: string
          format: date-time
          description: Precise timestamp with offset and up to six fractional digits.
        clientMutationId: { type: string, format: uuid }
        expectedRevision: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
    MvpMovement:
      type: object
      required: [id, accountId, type, amountMinor, currency, description, occurredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        type: { type: string, enum: [income, expense] }
        amountMinor: { type: string, pattern: '^[1-9][0-9]*$' }
        currency: { type: string, const: BRL }
        description: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    MvpHistoryPage:
      type: object
      required: [summary, entries, nextCursor]
      properties:
        summary:
          $ref: '#/components/schemas/MvpAccountSummary'
        entries:
          type: array
          maxItems: 50
          items:
            allOf:
              - $ref: '#/components/schemas/MvpMovement'
              - type: object
                required: [coverage]
                properties:
                  coverage: { type: string, enum: [covered, before_base, after_cut, no_base] }
        nextCursor: { type: [string, 'null'] }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Normalized by trimming surrounding whitespace and lowercasing.
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          maxLength: 256
    AppleAuthenticationRequest:
      type: object
      additionalProperties: false
      required: [identityToken, authorizationCode, nonce]
      properties:
        identityToken:
          type: string
          minLength: 1
          maxLength: 16384
          description: Compact RS256 identity token returned by Apple.
        authorizationCode:
          type: string
          minLength: 1
          maxLength: 4096
          description: Single-use authorization code returned by Apple.
        nonce:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Exact unpadded Base64URL raw nonce sent to Apple for this authorization attempt.
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, currency]
      properties:
        name:
          type: string
          minLength: 1
          description: User-provided account name; leading and trailing whitespace is removed before persistence, and whitespace-only names are invalid.
        currency:
          type: string
          const: BRL
          description: BRL is the only supported account currency in the current MVP.
    AccountResponse:
      type: object
      additionalProperties: false
      required: [id, name, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          const: BRL
        createdAt:
          type: string
          format: date-time
    TransactionRequest:
      type: object
      additionalProperties: false
      required:
        - accountId
        - type
        - amountMinor
        - currency
        - occurredAt
        - clientMutationId
      properties:
        accountId:
          type: string
          format: uuid
        categoryId:
          type: [string, 'null']
          format: uuid
        type:
          type: string
          enum: [expense, income]
          description: expense is an outgoing amount; income is an incoming amount.
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        description:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
        clientMutationId:
          type: string
          format: uuid
          description: Stable for retries of one logical operation; not independently persisted or database-unique in this milestone.
    TransactionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - accountId
        - categoryId
        - type
        - amountMinor
        - currency
        - description
        - occurredAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        categoryId:
          type: [string, 'null']
          format: uuid
        type:
          type: string
          enum: [expense, income]
          description: expense is an outgoing amount; income is an incoming amount.
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        description:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
    AccountLinkRequiredError:
      type: object
      additionalProperties: false
      required: [statusCode, message, code]
      properties:
        statusCode:
          type: integer
          const: 409
        message:
          type: string
          const: Account linking required
        code:
          type: string
          const: ACCOUNT_LINK_REQUIRED
  responses:
    MvpAccountSummary:
      description: Account, base, revision and balance at one server cut. For opening, this is the canonical receipt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MvpAccountSummary'
    MvpUnavailable:
      description: Temporary financial persistence failure or lock timeout. Retry a confirmation with the original key and payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MvpConflict:
      description: Incompatible idempotency key, existing active account, blocked legacy adoption, missing base, or a stale revision.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code, message]
            properties:
              statusCode: { const: 409 }
              code:
                enum: [IDEMPOTENCY_CONFLICT, MVP_ACCOUNT_EXISTS, LEGACY_ADOPTION_BLOCKED, BASE_REQUIRED, STALE_REVISION]
              message: { type: string }
    AuthTokens:
      description: Access token and a new opaque refresh token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    BadRequest:
      description: Invalid header or request body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Unique resource conflict or idempotency key reused with a different payload.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountLinkRequired:
      description: The verified Apple email belongs to another user; explicit linking is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountLinkRequiredError'
    Unauthorized:
      description: Missing, invalid, or expired authentication credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: A valid credential does not have the required password-origin authentication method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Account or category does not exist for the authenticated user. Foreign-owned resources are intentionally indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Authentication endpoint rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server or persistence failure.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Apple authentication is temporarily unavailable or misconfigured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
