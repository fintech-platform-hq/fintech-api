      responses:
        '204':
          description: Applied with an empty response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/method-operations/{operationId}:
    get:
      summary: Read a method operation receipt without repeating the mutation
      operationId: readIdentityMethodOutcome
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: operationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The originating holder and live session family see a committed receipt, if available. Unknown is non-terminal.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, action]
                    properties:
                      status: { type: string, enum: [committed] }
                      action: { type: string, enum: [apple_link, apple_unlink, password_link, password_unlink] }
                  - type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, enum: [unknown] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/password/change/proof:
    post:
      summary: Issue a single-use proof for the password-change operation
      operationId: preparePasswordChange
      security:
