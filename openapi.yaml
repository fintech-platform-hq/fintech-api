openapi: 3.1.0
info:
  title: Lenver API
  version: 1.1.0
  description: |
    V1 identity and session contract. The server checks the current holder, session family,
    and sign-in method. Password sessions with pending verification receive 403 on every
    financial endpoint. Expired, revoked, and pre-V1 sessions receive 401. The legacy
    /auth prefix is a compatibility alias with these same rules and request shapes.
    Email delivery in the local candidate is simulated.
servers:
  - url: https://fintech-api-87yw.onrender.com
    description: Production
  - url: http://localhost:3000
    description: Local development
security: []
paths:
  /mvp/account:
    get:
      summary: Read the authenticated personal-account summary
      operationId: getMvpAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MvpAccountSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
    post:
      summary: Confirm opening a new personal BRL account with its opening balance
      description: An explicit accountId requests legacy adoption, which remains blocked. An identical confirmed request replays its original result.
      operationId: openMvpAccount
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        $ref: '#/components/requestBodies/MvpOpening'
      responses:
        '201':
          $ref: '#/components/responses/MvpAccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/account/{accountId}:
    get:
      summary: Read the financial state of an owned BRL account by ID
      operationId: getOwnMvpAccount
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/MvpAccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/account-previews:
    post:
      summary: Review opening terms without persisting any effect
      operationId: previewMvpOpening
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/MvpOpening'
      responses:
        '200':
          description: Validated opening terms to confirm explicitly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpOpening'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/account/{accountId}/history:
    get:
      summary: Read an owned account, balance and a page of confirmed movements
      description: The summary and page use the same snapshot. The cursor preserves the cut and snapshot version. Reload the first page on STALE_REVISION. Movements are ordered by occurredAt descending and then by ID descending.
      operationId: getMvpHistory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 600 }
      responses:
        '200':
          description: First or subsequent page with up to 50 movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/check-previews:
    post:
      summary: Preview a dated balance check
      description: A cut inside the possible occurrence interval of a date-only expense returns OCCURRENCE_TIME_REQUIRED. Choose an unambiguous cut.
      operationId: previewMvpBalanceCheck
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MvpCheckInput'
      responses:
        '200':
          description: Read-only calculation at the requested cut and account revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpCheckPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/checks:
    post:
      summary: Confirm an immutable balance check
      description: Advances the account revision atomically with the observation and receipt. Creates zero movements. Compatible replay returns the original receipt before validating the current revision. A new cut inside a date-only interval returns OCCURRENCE_TIME_REQUIRED.
      operationId: confirmMvpBalanceCheck
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MvpCheckConfirmation'
      responses:
        '201':
          description: Original confirmed observation, including on compatible replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpCheckReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/account/{accountId}/checks:
    get:
      summary: Read an account's balance checks or open discrepancies
      description: Returns the current balance and the page from one account revision. Ordered by reference time, recording time, and ID, all descending.
      operationId: listMvpBalanceChecks
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: view
          in: query
          description: Only current observations with a nonzero residual appear in pending.
          schema: { type: string, enum: [all, pending], default: all }
        - name: after
          in: query
          description: Previous nextAfter. Supply together with the previous summary revision and keep the same view.
          schema: { type: string, format: uuid }
        - name: revision
          in: query
          description: Previous page summary revision. A revision change requires restarting pagination.
          schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
      responses:
        '200':
          description: Account summary and historical checks with the current discrepancy at each reference time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpChecksPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/audit-previews:
    post:
      summary: Preview an audited financial change
      operationId: previewMvpAuditedChange
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/MvpAuditFields' }]
              unevaluatedProperties: false
      responses:
        '200':
          description: Read-only projection at one revision. The token is absent as a usable value when a proposed start bisects date-only movements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MvpAuditPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409': { $ref: '#/components/responses/MvpConflict' }
        '503': { $ref: '#/components/responses/MvpUnavailable' }
  /mvp/audited-changes:
    post:
      summary: Confirm an audited change
      description: Confirms reviewed terms at the expected revision. Matching replays return the original receipt before current-revision and token checks.
      operationId: confirmMvpAuditedChange
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MvpAuditFields'
                - type: object
                  required: [expectedRevision, previewToken]
                  properties:
                    expectedRevision:
                      { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                    previewToken: { type: string, pattern: '^[0-9a-f]{64}$' }
                    confirmed:
                      type: boolean
                      description: Must be true for suspend_base, correct_base and refine_occurrence.
                  if:
                    properties:
                      action:
                        {
                          enum: [suspend_base, correct_base, refine_occurrence],
                        }
                  then:
                    required: [confirmed]
                    properties:
                      confirmed: { const: true }
              unevaluatedProperties: false
      responses:
        '201':
          description: Canonical audited receipt. A replacement also includes the immutable observation fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MvpAuditReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409': { $ref: '#/components/responses/MvpConflict' }
        '503': { $ref: '#/components/responses/MvpUnavailable' }
  /mvp/account/{accountId}/base-versions:
    get:
      summary: List the confirmed opening balance, suspensions and subsequent versions
      operationId: listMvpBaseVersions
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Immutable owner-only audit history in descending revision order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MvpBaseVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /mvp/account/{accountId}/history/{movementId}/versions:
    get:
      summary: List the original and audited versions of a movement
      operationId: listMvpMovementVersions
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: movementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The original followed by subsequent audited versions in confirmation order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MvpMovementVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '503': { $ref: '#/components/responses/MvpUnavailable' }
  /mvp/recovery-previews:
    post:
      summary: Review an expense against a balance check
      description: Read-only evaluation against one account revision. Suggestions match confirmed expenses on civil day and exact amount. Description only affects ranking. The caller can select an eligible movement through the account history.
      operationId: previewMvpExpenseRecovery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MvpRecoveryInput'
      responses:
        '200':
          description: Revision, exact projections, temporal eligibility and up to 50 candidates. No candidate is selected automatically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpRecoveryPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/recoveries:
    post:
      summary: Confirm a reviewed expense recovery
      description: Explicitly link an existing expense without changing the balance, or create a distinct covered expense with its link. Confirmation records the evidence and advances the account revision once. Deferring is a client action with no write. A compatible idempotent or external-reference replay returns the original receipt.
      operationId: confirmMvpExpenseRecovery
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MvpRecoveryConfirmation'
      responses:
        '201':
          description: Canonical receipt for the recovery and its linked movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpRecoveryReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /mvp/transactions:
    post:
      summary: Register an income or expense in the active personal account
      description: An identical confirmation replays the original receipt before checking the live revision. New movements require BRL, a confirmed base, and an occurrence from the coverage start through server time, inclusive.
      operationId: registerMvpTransaction
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MvpTransactionRequest'
      responses:
        '201':
          description: Canonical receipt persisted with the movement and the new revision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MvpMovement'
                  - type: object
                    required: [revision]
                    properties:
                      revision: { type: string, pattern: '^[1-9][0-9]*$' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MvpConflict'
        '503':
          $ref: '#/components/responses/MvpUnavailable'
  /v1/auth/register:
    post:
      summary: Register with email and password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/login:
    post:
      summary: Authenticate with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/apple:
    post:
      summary: Authenticate with Sign in with Apple
      operationId: authenticateWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthenticationRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/AccountLinkRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/apple/link:
    post:
      summary: Explicitly link a Sign in with Apple identity
      operationId: linkAppleIdentity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdentityMethodOperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleLinkProof'
      responses:
        '204':
          description: Apple identity linked; the current session remains valid.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/logout:
    post:
      summary: Revoke the family associated with the submitted refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Family revoked if the token was known, with an empty response for every valid request.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/session:
    get:
      summary: Read the current method and email verification status
      operationId: currentIdentitySession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/verification:
    post:
      summary: Request a code for the pending password email
      operationId: requestVerificationCode
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/verification/confirm:
    post:
      summary: Consume the current single-use verification code
      operationId: confirmVerificationCode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailProof'
      responses:
        '204':
          description: Applied with an empty response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/verification/email:
    post:
      summary: Correct the pending email after confirming the current password
      operationId: updatePendingVerificationEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '204':
          description: Applied with an empty response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/recovery:
    post:
      summary: Request recovery with a neutral response
      operationId: requestPasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityEmail'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/recovery/confirm:
    post:
      summary: Reset the credential with a recovery code
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryProof'
      responses:
        '204':
          description: Applied with an empty response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/apple/unlink:
    post:
      summary: Remove Apple while preserving a verified password
      operationId: unlinkAppleIdentity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdentityMethodOperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordProof'
      responses:
        '204':
          description: Applied with an empty response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/password/link:
